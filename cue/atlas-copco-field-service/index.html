<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Copco · Field Service Prototype</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@salesforce-ux/design-system@2.24.4/assets/styles/salesforce-lightning-design-system.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --sf-blue:#0176d3;
    --sf-blue-dark:#032d60;
    --ink:#181818;
    --muted:#5c5c5c;
    --line:#e5e5e5;
    --bg:#f7f9fb;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 24px;}
  /* HERO */
  .hero{
    background:linear-gradient(120deg,#032d60 0%,#0176d3 60%,#1b96ff 100%);
    color:#fff;padding:72px 0 76px;
  }
  .hero .wrap{max-width:1100px;}
  .eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;font-weight:600;opacity:.85;margin:0 0 18px;}
  .hero h1{font-size:2.9rem;line-height:1.08;margin:0 0 18px;font-weight:700;max-width:720px;}
  .hero h1 em{font-style:italic;color:#a5d8ff;}
  .hero p{font-size:1.15rem;line-height:1.5;max-width:620px;margin:0;opacity:.94;}
  /* SECTIONS */
  section.block{padding:60px 0;}
  section.block.alt{background:var(--bg);}
  h2.section-title{font-size:1.7rem;font-weight:700;margin:0 0 8px;color:var(--sf-blue-dark);}
  p.section-sub{font-size:1.02rem;color:var(--muted);margin:0 0 34px;max-width:660px;}
  /* VALUE GRID */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .card .ic{font-size:1.7rem;display:block;margin-bottom:12px;}
  .card h3{font-size:1.12rem;margin:0 0 8px;font-weight:700;}
  .card .metric{color:var(--sf-blue);font-weight:600;font-size:.92rem;margin:0 0 8px;}
  .card p.supp{font-size:.92rem;color:var(--muted);margin:0;line-height:1.45;}
  /* PAINS */
  .pain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;}
  .pain{background:#fff;border:1px solid var(--line);border-left:4px solid #ba0517;border-radius:10px;padding:20px 22px;}
  .pain h4{margin:0 0 8px;font-size:1.02rem;font-weight:700;}
  .pain .impact{font-size:.9rem;color:var(--muted);margin:0 0 10px;line-height:1.45;}
  .pain .work{font-size:.82rem;color:#8a6d00;background:#fff7e0;border-radius:6px;padding:6px 10px;display:inline-block;}
  /* PROTOTYPE captions */
  .coach{background:#eef6fd;border:1px solid #cfe7fb;border-radius:10px;padding:14px 18px;font-size:.93rem;color:#032d60;line-height:1.5;margin-bottom:20px;}
  .coach strong{color:var(--sf-blue-dark);}
  /* tab strip for prototype nav */
  .demo-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
  .demo-tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:24px;padding:9px 18px;font-size:.88rem;font-weight:600;cursor:pointer;transition:.15s;}
  .demo-tab.active{background:var(--sf-blue);color:#fff;border-color:var(--sf-blue);}
  /* phone */
  .phone-wrap{display:flex;justify-content:center;}
  .phone{width:390px;max-width:100%;background:#000;border-radius:42px;padding:12px;box-shadow:0 18px 50px rgba(3,45,96,.28);}
  .phone-inner{background:#fff;border-radius:32px;overflow:hidden;height:720px;display:flex;flex-direction:column;}
  .statusbar{background:#000;color:#fff;font-size:.75rem;display:flex;justify-content:space-between;padding:8px 22px 6px;font-weight:600;}
  .app-scroll{flex:1;overflow-y:auto;background:#fafafa;}
  .m-appbar{background:#0176d3;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;}
  .m-appbar .x{font-size:1.3rem;line-height:1;cursor:pointer;}
  .m-appbar .lbl{font-size:.7rem;letter-spacing:.08em;opacity:.85;text-transform:uppercase;}
  .m-appbar .ttl{font-size:1rem;font-weight:700;}
  .tabbar{display:flex;border-top:1px solid var(--line);background:#fff;}
  .tabbar .t{flex:1;text-align:center;padding:9px 0 7px;font-size:.6rem;color:var(--muted);}
  .tabbar .t.active{color:var(--sf-blue);}
  .tabbar .t .ti{font-size:1.1rem;display:block;}
  .sec-h{font-weight:700;font-size:.95rem;margin:0 0 6px;color:#181818;}
  .m-section{background:#fff;margin:10px;border-radius:10px;padding:14px 16px;border:1px solid #eee;}
  .m-tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;}
  .m-tabs .mt{padding:11px 14px;font-size:.8rem;color:var(--muted);white-space:nowrap;font-weight:600;border-bottom:2px solid transparent;}
  .m-tabs .mt.active{color:var(--sf-blue);border-bottom-color:var(--sf-blue);}
  .primary-bar{padding:12px;background:#fff;border-top:1px solid var(--line);}
  /* desktop browser frame */
  .browser{border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 14px 40px rgba(3,45,96,.14);background:#fff;}
  .browser .titlebar{background:#f3f3f3;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:7px;}
  .dot{width:11px;height:11px;border-radius:50%;}
  .dot.r{background:#ff5f57;}.dot.y{background:#febc2e;}.dot.g{background:#28c840;}
  .browser .urlbar{flex:1;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:.78rem;color:var(--muted);padding:5px 12px;margin-left:10px;}
  /* dispatcher console */
  .lt-nav{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:8px 16px;font-size:.82rem;}
  .lt-nav .logo{width:22px;height:22px;background:#0176d3;border-radius:5px;}
  .lt-nav b{color:#032d60;}
  .lt-nav a{color:#3e3e3c;text-decoration:none;}
  .lt-nav a.cur{color:#0176d3;font-weight:600;border-bottom:2px solid #0176d3;padding-bottom:6px;}
  .console-head{background:#fafaf9;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
  .console-head h3{margin:0;font-size:1.05rem;color:#032d60;}
  .console-body{display:grid;grid-template-columns:230px 1fr 280px;height:430px;}
  .res-list{border-right:1px solid var(--line);overflow-y:auto;}
  .res-row{display:flex;gap:9px;align-items:center;padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:.8rem;cursor:pointer;}
  .res-row:hover{background:#f3f9ff;}
  .avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:.75rem;}
  .gantt{overflow:auto;background:#fff;}
  .gantt-axis{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fafaf9;}
  .gantt-axis .h{flex:1;min-width:70px;text-align:center;font-size:.68rem;color:var(--muted);padding:6px 0;border-left:1px solid #f0f0f0;}
  .gantt-row{display:flex;border-bottom:1px solid #f4f4f4;height:48px;position:relative;align-items:center;}
  .blk{position:absolute;height:30px;border-radius:5px;font-size:.62rem;color:#fff;padding:3px 6px;overflow:hidden;white-space:nowrap;font-weight:600;display:flex;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.15);}
  .map{border-left:1px solid var(--line);background:linear-gradient(135deg,#dbe9f4 0%,#cfe0ee 100%);position:relative;}
  .pin{position:absolute;width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);}
  .queue{border-top:1px solid var(--line);padding:0;}
  footer.foot{background:#032d60;color:#b6cbe4;padding:30px 0;font-size:.85rem;}
  footer.foot .wrap{display:flex;flex-direction:column;gap:6px;}
  footer.foot b{color:#fff;}
  @media(max-width:760px){
    .hero h1{font-size:2.1rem;}
    .console-body{grid-template-columns:1fr;height:auto;}
    .map{height:180px;}
    .res-list{max-height:160px;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const SPRITE_U = "https://cdn.jsdelivr.net/npm/@salesforce-ux/design-system@2.24.4/assets/icons/utility-sprite/svg/symbols.svg#";

function Icon({name,size="x-small",cls=""}){
  return (
    <svg className={`slds-icon slds-icon_${size} ${cls}`} aria-hidden="true">
      <use xlinkHref={SPRITE_U+name}></use>
    </svg>
  );
}

/* ---------- HERO ---------- */
function Hero(){
  return (
    <div className="hero">
      <div className="wrap">
        <p className="eyebrow">Atlas Copco · Field Service</p>
        <h1>Arrive prepared. <em>Resolve faster.</em></h1>
        <p>Give every technician a complete job brief before they drive, and give dispatchers live visibility of the field — so the first visit is the only visit.</p>
      </div>
    </div>
  );
}

/* ---------- VALUE DRIVERS ---------- */
const drivers = [
  {ic:"🔧",t:"Fewer repeat visits",m:"↑ First-time fix rate",s:"Asset history and required parts in hand before the technician leaves the depot."},
  {ic:"📍",t:"Responsive dispatching",m:"↓ Job completion time · ↑ utilization",s:"Live technician location and status lets dispatchers reassign on the fly."},
  {ic:"⚡",t:"More jobs per day",m:"↑ Jobs/day · ↓ avg job duration",s:"Less guesswork on site means technicians spend time fixing, not searching."},
];
function ValueDrivers(){
  return (
    <section className="block">
      <div className="wrap">
        <h2 className="section-title">Why it matters</h2>
        <p className="section-sub">Three outcomes that turn field execution into a competitive advantage for Atlas Copco service teams.</p>
        <div className="grid">
          {drivers.map((d,i)=>(
            <div className="card" key={i}>
              <span className="ic">{d.ic}</span>
              <h3>{d.t}</h3>
              <p className="metric">{d.m}</p>
              <p className="supp">{d.s}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ---------- PROTOTYPE: Screen 1 — Prework Brief (mobile) ---------- */
function PreworkBrief(){
  const [tab,setTab]=useState("Overview");
  const tabs=["Overview","Parts","History","Details"];
  return (
    <div className="phone">
      <div className="phone-inner">
        <div className="statusbar"><span>9:41</span><span>✈ 100% ▮</span></div>
        <div className="m-appbar" style={{background:"#9e2146"}}>
          <span className="x">‹</span>
          <div>
            <div className="lbl">Work Order · 00045821 · PM</div>
            <div className="ttl">Compressor Maintenance</div>
          </div>
        </div>
        <div className="m-tabs">
          {tabs.map(t=>(
            <div key={t} className={"mt"+(tab===t?" active":"")} onClick={()=>setTab(t)}>{t}</div>
          ))}
        </div>
        <div className="app-scroll">
          {tab==="Overview" && <>
            <div className="m-section">
              <p className="sec-h">Atlas Copco ZE 37 VSD</p>
              <p style={{margin:"0 0 4px",fontSize:".82rem",color:"#5c5c5c"}}>Today's job is critical, please read carefully.</p>
              <p className="sec-h" style={{marginTop:12}}>Overview</p>
              <p style={{margin:0,fontSize:".82rem",lineHeight:1.5}}>You are scheduled at <b>Hoffman Manufacturing, Eindhoven</b> today at 10:00 AM for a scheduled annual Preventive Maintenance on the rotary screw compressor.</p>
              <p className="sec-h" style={{marginTop:12}}>Perform Work</p>
              <p style={{margin:0,fontSize:".82rem",lineHeight:1.5}}>Standard PM under the "Full Coverage – PM" service contract. Follow the maintenance checklist, run diagnostics, and verify operating pressure before sign-off.</p>
              <div style={{background:"#fff7e0",borderRadius:8,padding:"10px 12px",marginTop:12,fontSize:".8rem",color:"#8a6d00"}}>
                <b>⚠ Customer note:</b> "Unit making unusual noise — check bearing."
              </div>
            </div>
            <div className="primary-bar">
              <button className="slds-button slds-button_outline-brand slds-button_stretch">
                <Icon name="volume_high" cls="slds-button__icon slds-button__icon_left"/> Read Aloud
              </button>
            </div>
          </>}
          {tab==="Parts" && <div className="m-section">
            <p className="sec-h">Parts Breakdown</p>
            <table className="slds-table slds-table_bordered slds-table_cell-buffer" style={{fontSize:".8rem"}}>
              <thead><tr><th>Part</th><th style={{width:70}}>Qty</th></tr></thead>
              <tbody>
                <tr><td>Valve seal kit (1623-077)</td><td>2</td></tr>
                <tr><td>Air filter element (2914-501)</td><td>1</td></tr>
                <tr><td>Belt tension gauge</td><td>1</td></tr>
              </tbody>
            </table>
            <p style={{fontSize:".76rem",color:"#5c5c5c",margin:"8px 0 0"}}>All parts confirmed in van stock ✓</p>
          </div>}
          {tab==="History" && <div className="m-section">
            <p className="sec-h">Service History</p>
            <ul className="slds-timeline" style={{fontSize:".82rem"}}>
              <li style={{paddingBottom:14,borderLeft:"2px solid #0176d3",paddingLeft:12,marginLeft:4}}>
                <b>6 months ago</b> — Replaced valve seal. Unit returned to service, no faults.
              </li>
              <li style={{paddingBottom:14,borderLeft:"2px solid #c9c9c9",paddingLeft:12,marginLeft:4}}>
                <b>14 months ago</b> — Annual PM. Filter + oil change. Pressure within spec.
              </li>
              <li style={{borderLeft:"2px solid #c9c9c9",paddingLeft:12,marginLeft:4}}>
                <b>2 yrs ago</b> — Commissioned. Baseline diagnostics recorded.
              </li>
            </ul>
          </div>}
          {tab==="Details" && <div className="m-section">
            <p className="sec-h">Asset & Site</p>
            <dl style={{fontSize:".82rem",margin:0}}>
              <dt style={{color:"#5c5c5c"}}>Asset</dt><dd style={{margin:"0 0 8px",fontWeight:600}}>ZE 37 VSD · Serial 31141</dd>
              <dt style={{color:"#5c5c5c"}}>Customer</dt><dd style={{margin:"0 0 8px",fontWeight:600}}>Hoffman Manufacturing</dd>
              <dt style={{color:"#5c5c5c"}}>Site contact</dt><dd style={{margin:"0 0 8px",fontWeight:600}}>Jan Smith · +31 6 2244 1180</dd>
              <dt style={{color:"#5c5c5c"}}>Address</dt><dd style={{margin:0,fontWeight:600}}>Esp 240, 5633 AC Eindhoven</dd>
            </dl>
          </div>}
        </div>
        <div className="tabbar">
          <div className="t active"><span className="ti">📅</span>Schedule</div>
          <div className="t"><span className="ti">📦</span>Inventory</div>
          <div className="t"><span className="ti">🔔</span>Notifications</div>
          <div className="t"><span className="ti">👤</span>Profile</div>
        </div>
      </div>
    </div>
  );
}

/* ---------- PROTOTYPE: Screen 2 — Dispatcher Console (desktop) ---------- */
function DispatcherConsole(){
  const resources=[
    {n:"John Pieters",r:"Compressor Specialist",c:"#1b96ff",init:"JP",booked:"En route",blocks:[{l:"SA-1180 / Hoffman PM",s:18,w:30,c:"#04844b"}]},
    {n:"Maria Lopez",r:"HVAC / Air Systems",c:"#fe9339",init:"ML",booked:"In progress",blocks:[{l:"SA-1210 / Verbeek Repair",s:30,w:38,c:"#fe9339"}]},
    {n:"Ahmed Hassan",r:"Field Service Engineer",c:"#04844b",init:"AH",booked:"Available",blocks:[]},
    {n:"Lena Visser",r:"Diagnostics Lead",c:"#0176d3",init:"LV",booked:"In progress",blocks:[{l:"SA-1234 / Compressor Cal",s:12,w:26,c:"#04844b"},{l:"SA-1290 / Site Survey",s:55,w:22,c:"#ba0517"}]},
    {n:"Tom de Wit",r:"Apprentice (50%)",c:"#9050e9",init:"TW",booked:"Allocated",blocks:[{l:"SA-1311 / Filter Swap",s:40,w:18,c:"#04844b"}]},
  ];
  const hours=["6AM","7AM","8AM","9AM","10AM","11AM","12PM","1PM","2PM"];
  return (
    <div className="browser">
      <div className="titlebar">
        <span className="dot r"></span><span className="dot y"></span><span className="dot g"></span>
        <span className="urlbar">https://atlascopco.lightning.force.com/lightning/n/Scheduling_Console</span>
      </div>
      <div className="lt-nav">
        <span className="logo"></span>
        <b>Field Service</b>
        <a href="#">Home</a>
        <a href="#" className="cur">Scheduling Console</a>
        <a href="#">Work Orders</a>
        <a href="#">Service Appointments</a>
        <a href="#">Service Resources</a>
      </div>
      <div className="console-head">
        <h3>⚡ Scheduling Console</h3>
        <div>
          <button className="slds-button slds-button_neutral slds-button_small">Today</button>
          <button className="slds-button slds-button_brand slds-button_small">Optimize ▾</button>
        </div>
      </div>
      <div className="console-body">
        {/* resources */}
        <div className="res-list">
          <div style={{padding:"8px 12px",fontSize:".72rem",color:"#5c5c5c",fontWeight:600,borderBottom:"1px solid #eee"}}>Eindhoven · Resources (5)</div>
          {resources.map((r,i)=>(
            <div className="res-row" key={i}>
              <div className="avatar" style={{background:r.c}}>{r.init}</div>
              <div style={{overflow:"hidden"}}>
                <div style={{fontWeight:600,whiteSpace:"nowrap"}}>{r.n}</div>
                <div style={{fontSize:".7rem",color:"#5c5c5c",whiteSpace:"nowrap"}}>{r.r} · {r.booked}</div>
              </div>
            </div>
          ))}
        </div>
        {/* gantt */}
        <div className="gantt">
          <div className="gantt-axis">
            {hours.map(h=><div className="h" key={h}>{h}</div>)}
          </div>
          {resources.map((r,i)=>(
            <div className="gantt-row" key={i}>
              {r.blocks.map((b,j)=>(
                <div className="blk" key={j} style={{left:b.s+"%",width:b.w+"%",background:b.c}}>{b.l}</div>
              ))}
            </div>
          ))}
        </div>
        {/* map */}
        <div className="map">
          <div style={{position:"absolute",top:10,left:12,fontSize:".72rem",color:"#3a5a78",fontWeight:600}}>Eindhoven region</div>
          <div className="pin" style={{top:"30%",left:"40%",background:"#1b96ff"}}></div>
          <div className="pin" style={{top:"55%",left:"60%",background:"#fe9339"}}></div>
          <div className="pin" style={{top:"45%",left:"25%",background:"#04844b"}}></div>
          <div className="pin" style={{top:"68%",left:"38%",background:"#0176d3"}}></div>
          <div className="pin" style={{top:"22%",left:"68%",background:"#9050e9"}}></div>
          <div style={{position:"absolute",bottom:10,left:12,right:12,background:"rgba(255,255,255,.92)",borderRadius:8,padding:"8px 10px",fontSize:".7rem"}}>
            <b style={{color:"#04844b"}}>● Ahmed Hassan</b> — available, 4.2 km from incoming priority job.
          </div>
        </div>
      </div>
      {/* queue */}
      <div className="queue">
        <div style={{padding:"8px 16px",fontSize:".78rem",fontWeight:600,color:"#032d60",background:"#fafaf9",borderBottom:"1px solid #eee"}}>Unscheduled Service Appointments (3)</div>
        <table className="slds-table slds-table_bordered slds-table_cell-buffer" style={{fontSize:".8rem"}}>
          <thead><tr><th>Appt #</th><th>Customer</th><th>Type</th><th>Priority</th><th>Window</th></tr></thead>
          <tbody>
            <tr><td><a href="#">SA-1340</a></td><td>De Bruin Logistics</td><td>Emergency Repair</td><td><span className="slds-badge slds-theme_error">High</span></td><td>11:00 – 13:00</td></tr>
            <tr><td><a href="#">SA-1341</a></td><td>Nova Foods BV</td><td>PM Service</td><td><span className="slds-badge slds-theme_warning">Medium</span></td><td>13:00 – 15:00</td></tr>
            <tr><td><a href="#">SA-1342</a></td><td>Hoffman Manufacturing</td><td>Inspection</td><td><span className="slds-badge">Low</span></td><td>15:00 – 17:00</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- PROTOTYPE: Screen 3 — Job Completion (mobile) ---------- */
function JobCompletion(){
  const [steps,setSteps]=useState([true,true,true,false]);
  const labels=["Replace valve seal (2 of 2)","Run system diagnostics","Verify operating pressure","Customer sign-off"];
  const toggle=(i)=>setSteps(s=>s.map((v,j)=>j===i?!v:v));
  const done=steps.filter(Boolean).length;
  const allDone=done===steps.length;
  return (
    <div className="phone">
      <div className="phone-inner">
        <div className="statusbar"><span>9:41</span><span>✈ 100% ▮</span></div>
        <div className="m-appbar">
          <span className="x">‹</span>
          <div>
            <div className="lbl">Work Order · 00045821</div>
            <div className="ttl">Complete Job</div>
          </div>
        </div>
        {/* path */}
        <div style={{background:"#fff",padding:"10px 14px",borderBottom:"1px solid #eee",fontSize:".72rem",display:"flex",justifyContent:"space-between",color:"#5c5c5c"}}>
          <span style={{color:"#04844b"}}>✓ Dispatched</span>
          <span style={{color:"#04844b"}}>✓ Traveling</span>
          <span style={{color:"#04844b"}}>✓ On Site</span>
          <span style={{color:allDone?"#0176d3":"#9c9c9c",fontWeight:700}}>Completed</span>
        </div>
        <div className="app-scroll">
          <div className="m-section">
            <p className="sec-h">Completion Checklist ({done}/4)</p>
            {labels.map((l,i)=>(
              <label key={i} style={{display:"flex",gap:10,alignItems:"center",padding:"9px 0",fontSize:".84rem",borderBottom:i<3?"1px solid #f1f1f1":"none",cursor:"pointer"}}>
                <input type="checkbox" checked={steps[i]} onChange={()=>toggle(i)} style={{width:18,height:18,accentColor:"#0176d3"}}/>
                <span style={{textDecoration:steps[i]?"line-through":"none",color:steps[i]?"#9c9c9c":"#181818"}}>{l}</span>
              </label>
            ))}
          </div>
          <div className="m-section">
            <p className="sec-h">Before / After Photos</p>
            <div style={{display:"flex",gap:8}}>
              <div style={{flex:1,height:78,borderRadius:8,background:"linear-gradient(135deg,#cdd7e0,#9aa7b3)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:".68rem"}}>Before<br/>bearing</div>
              <div style={{flex:1,height:78,borderRadius:8,background:"linear-gradient(135deg,#bfe3cf,#7fc59c)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:".68rem"}}>After<br/>new seal</div>
              <div style={{flex:1,height:78,borderRadius:8,border:"2px dashed #c9c9c9",display:"flex",alignItems:"center",justifyContent:"center",color:"#0176d3",fontSize:"1.4rem"}}>＋</div>
            </div>
          </div>
          <div className="m-section">
            <p className="sec-h">Customer Signature</p>
            <div style={{border:"1px solid #eee",borderRadius:8,padding:"14px",textAlign:"center"}}>
              <div style={{fontFamily:"cursive",fontSize:"1.5rem",color:"#032d60"}}>Jan Smith</div>
              <div style={{fontSize:".7rem",color:"#5c5c5c",marginTop:4}}>Signed on site · Time on site: 47 min</div>
            </div>
          </div>
          <div className="m-section" style={{background:"#eef6ff"}}>
            <p style={{margin:0,fontSize:".8rem",color:"#032d60"}}>Status selector</p>
            <select className="slds-select" defaultValue="completed" style={{marginTop:6}}>
              <option value="completed">Completed</option>
              <option value="cannot">Cannot Complete</option>
              <option value="followup">Follow-up Required</option>
            </select>
          </div>
        </div>
        <div className="primary-bar">
          <button className="slds-button slds-button_brand slds-button_stretch" disabled={!allDone}
            style={{background:allDone?"#04844b":"#c9c9c9",borderColor:allDone?"#04844b":"#c9c9c9"}}>
            {allDone? "✓ Submit & Notify Dispatcher" : `Complete all steps (${done}/4)`}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------- PROTOTYPE WRAPPER ---------- */
const screens=[

  {id:"dispatch",label:"2 · Dispatcher Visibility",persona:"Dispatcher",

  {id:"complete",label:"3 · Job Completion",persona:"Technician",

        <h2 className="section-title">See it in action</h2>
        <p className="section-sub">Click through the flow Donald walks every Atlas Copco service team through — from prework brief to dispatch to completion.</p>
        <div className="demo-tabs">
          {screens.map((sc,i)=>(
            <button key={sc.id} className={"demo-tab"+(i===active?" active":"")} onClick={()=>setActive(i)}>{sc.label}</button>
          ))}
        </div>
        <div className="coach">
          <strong>{s.persona} view — </strong>{s.narrative}
        </div>
        {isDesktop ? <DispatcherConsole/> : <div className="phone-wrap">{s.render()}</div>}

    </section>
  );
}
